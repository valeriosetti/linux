# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/amlogic,toddr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Amlogic AUDIN TODDR controller

maintainers:
  - Valerio Setti <vsetti@baylibre.com>

allOf:
  - $ref: dai-common.yaml#

properties:
  $nodename:
    pattern: "^audin-toddr@.*"

  "#sound-dai-cells":
    const: 0

  compatible:
    items:
      - enum:
          - amlogic,toddr-gxbb
      - const: amlogic,toddr

  clocks:
    items:
      - description: AUDIN peripheral clock

  clock-names:
    items:
      - const: i2s_input_clk

  reg:
    maxItems: 1

  sound-name-prefix: true

required:
  - "#sound-dai-cells"
  - compatible
  - clocks
  - clock-names
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/gxbb-clkc.h>

    audin-toddr@a080 {
      compatible = "amlogic,toddr-gxbb", "amlogic,toddr";
      #sound-dai-cells = <0>;
      sound-name-prefix = "TODDR0";
      reg = <0xa080 0x1c>;
      status = "disabled";
      clocks = <&clkc CLKID_I2S_SPDIF>;
      clock-names = "i2s_input_clk";
    };
